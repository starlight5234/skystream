name: skystream_watchparty
description: Standalone WatchParty WebRTC & Serverless Signaling plugin for SkyStream.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  supabase_flutter: ^2.8.3
  flutter_webrtc: ^0.12.3
  qr_flutter: ^4.1.0
  encrypt: ^5.0.3
  crypto: ^3.0.7
  shared_preferences: ^2.5.4
  go_router: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
